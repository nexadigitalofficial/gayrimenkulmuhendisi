name: Daily Real Estate Intelligence Pipeline

on:
  schedule:
    # Her gün Türkiye saatiyle 09:00'da (06:00 UTC) çalışır
    - cron: '0 6 * * *'
  workflow_dispatch: # Manuel olarak da tetiklenebilir

permissions:
  contents: write

jobs:
  run-intelligence-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Run NEXA Intelligence Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m intelligence.pipeline --mode daily

      - name: Commit and Push Updated Intelligence Cache & DB
        run: |
          git config --global user.name "NEXA Intelligence Bot"
          git config --global user.email "bot@nexadigital.com"
          git add static/data/latest_news.json data/intelligence.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(bot): update daily real estate intelligence & pulse [skip ci]" && git push)
