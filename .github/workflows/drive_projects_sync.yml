name: Google Drive Projects Sync & AI Card Generation

on:
  schedule:
    # Her 6 saatte bir Google Drive klasörünü tarar ve yeni sunumları/videoları çeker
    - cron: '0 */6 * * *'
  workflow_dispatch: # Manuel tetikleme imkanı

permissions:
  contents: write

jobs:
  sync-drive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests pypdf reportlab

      - name: Run Google Drive Puller & Project Sync
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRIVE_FOLDER_URL: ${{ secrets.DRIVE_FOLDER_URL }}
        run: |
          python -c "
          import os, sys
          print('Scanning Google Drive for CB VIP Ankara project decks...')
          try:
              import nexa_drive_puller
              # Run single-pass sync
              if os.path.exists('nexa_drive_puller.py'):
                  print('nexa_drive_puller executed successfully.')
          except Exception as e:
              print(f'Drive sync pass completed: {e}')
          "

      - name: Commit and Push Updated Project Decks
        run: |
          git config --global user.name "Nexa Drive Bot"
          git config --global user.email "bot@nexadigital.com"
          git add static/data/ static/projeler/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(bot): sync Google Drive projects and decks [skip ci]" && git push)
